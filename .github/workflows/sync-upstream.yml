name: Sync upstream
on:
  schedule:
    - cron: '23 10 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cloudmail-upstream-sync
jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.repository == 'MerceMay/CloudMail' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge upstream main
        run: |
          git fetch https://github.com/maillab/cloud-mail.git main
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git merge --no-commit --no-ff FETCH_HEAD; then
            git rev-parse --verify MERGE_HEAD >/dev/null
          fi
          # Keep this fork's workflows. GITHUB_TOKEN cannot update workflow files.
          git restore --source=HEAD --staged --worktree -- .github/workflows/
          if [ -n "$(git ls-files -u)" ]; then
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git commit --no-edit
          git push origin HEAD:main
